# Browser tests (tests/e2e): the production build in Google Chrome (Android-like phone profiles)
# and Playwright WebKit (iPhone profiles). Runs on every push to main and every pull request.
# Not a gate for the deploy yet: it reports, so an environment-specific flake can't block a fix.
#
# Same hardening as the other workflows: SHA-pinned actions, read-only token, no cache, packages
# only from the lockfile with verified signatures and no install scripts. The WebKit browser is
# downloaded by playwright-core from Playwright's CDN; Chrome is the one preinstalled on the runner.
name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Pinned: Playwright 1.49 installs WebKit system libraries only on distributions it knows.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check lockfile sources
        run: |
          node -e '
            const pk = require("./package-lock.json").packages;
            const bad = Object.entries(pk).filter(([k, v]) => k &&
              !(v.resolved?.startsWith("https://registry.npmjs.org/") && v.integrity?.startsWith("sha512-")));
            if (bad.length) { console.error("Not from registry.npmjs.org with sha512:", bad.map(([k]) => k)); process.exit(1); }'
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - name: Install WebKit and its system libraries
        run: npx playwright-core install --with-deps webkit
      - run: npm run build
      - run: npm run test:e2e
